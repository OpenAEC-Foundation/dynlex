name: Studio contour editing regression checks
on:
  push:
    branches: [build/obs-pattern-editing]
permissions:
  contents: read
  actions: read
jobs:
  editing:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Restore the pinned compiler artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40773371392 --repo OpenAEC-Foundation/dynlex --name obs-linux-toolchain-c2d32bea --dir /tmp/compiler-artifact
          tar -xzf /tmp/compiler-artifact/obs-linux-toolchain.tar.gz -C /tmp
          mkdir -p build lib/dynlex build/runtime-objects
          cp /tmp/obs-toolchain/build/dynlex build/dynlex
          chmod +x build/dynlex
          sha256sum build/dynlex
          for file in filesystemRuntime hostRuntime pathRuntime pathUriRuntime processRuntime runtimeError runtimeText filesystemRuntimePosix filesystemTransactionPosix hostRuntimePosix processRuntimePosix processRuntimePosixWrite; do
            cc -std=c11 -O2 -fPIC -Isrc/runtime -c src/runtime/$file.c -o build/runtime-objects/$file.o
          done
          ar rcs lib/dynlex/libdynlex_runtime.a build/runtime-objects/*.o
          sudo apt-get update -qq
          sudo apt-get install -y libfreetype-dev libglfw3-dev libvulkan-dev
          for file in graphicsRuntime graphicsRuntimeDraw graphicsRuntimePipeline graphicsRuntimeTexture graphicsRuntimeVulkan; do
            cc -std=c11 -O2 -fPIC -Isrc/runtime -c src/runtime/$file.c -o build/runtime-objects/$file.o
          done
          ar rcs lib/dynlex/libdynlex_graphics.a build/runtime-objects/graphics*.o
      - uses: actions/checkout@v7
        with:
          repository: OpenAEC-Foundation/open-bim-studio
          ref: b98b67917ab888bf819278098c24f50ab3857b96
          path: obs
      - name: Compile and run three focused editing and system tests
        working-directory: obs
        env:
          DYNLEX_ROOT: ${{ github.workspace }}
          BIM_JOBS: '1'
        run: |
          git rev-parse HEAD > editing-source.txt
          /usr/bin/time -v bash build.sh bundle system_editing building_system system_types > editing.log 2> editing.time
          cat editing.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: obs-pattern-editing
          path: |
            obs/editing-source.txt
            obs/editing.log
            obs/editing.time
            obs/build/tests/bundle.diag
            obs/build/tests/bundle.out
            obs/build/tests/bundled/
          retention-days: 14
