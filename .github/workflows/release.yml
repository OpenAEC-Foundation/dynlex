name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-version-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches metadata/VERSION
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Validating release builds without publication."
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < metadata/VERSION)"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match metadata/VERSION ($FILE_VERSION)." >&2
            exit 1
          fi

  build-linux:
    needs: [verify-version-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
            machine_architecture: x86_64
            debian_architecture: amd64
            deb_asset_id: linux-x64-deb
            tar_asset_id: linux-x64-tar
          - runner: ubuntu-24.04-arm
            architecture: arm64
            machine_architecture: aarch64
            debian_architecture: arm64
            deb_asset_id: linux-arm64-deb
            tar_asset_id: linux-arm64-tar
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore pinned LLVM toolchain
        uses: actions/cache@v4
        with:
          path: .cache/llvm-toolchain
          key: llvm-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('metadata/LLVM_TOOLCHAIN', 'scripts/llvm_toolchain.sh') }}

      - name: Install dependencies
        run: ./scripts/install.sh

      - name: Build and test (Release)
        run: ./scripts/test.sh --release

      - name: Package release artifacts
        id: package
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "${{ matrix.machine_architecture }}" ]]; then
            echo "Expected ${{ matrix.machine_architecture }} runner, found $(uname -m)." >&2
            exit 1
          fi
          python3 ./scripts/verify-executable-architecture.py \
            build/dynlex "${{ matrix.architecture }}"
          DEB_NAME="$(./scripts/release-asset.sh name '${{ matrix.deb_asset_id }}')"
          TAR_NAME="$(./scripts/release-asset.sh name '${{ matrix.tar_asset_id }}')"
          PACKAGE_BASENAME="${DEB_NAME%.deb}"
          if [[ "$TAR_NAME" != "$PACKAGE_BASENAME.tar.gz" ]]; then
            echo "Linux DEB and tar release assets must share one package basename." >&2
            exit 1
          fi
          cd build
          cpack -G DEB -D CPACK_PACKAGE_FILE_NAME="$PACKAGE_BASENAME"
          cpack -G TGZ -D CPACK_PACKAGE_FILE_NAME="$PACKAGE_BASENAME"
          test -f "$DEB_NAME"
          test -f "$TAR_NAME"
          if [[ "$(dpkg-deb --field "$DEB_NAME" Architecture)" != "${{ matrix.debian_architecture }}" ]]; then
            echo "Debian package has the wrong architecture." >&2
            exit 1
          fi
          echo "deb_name=$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "tar_name=$TAR_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.architecture }}
          path: |
            build/${{ steps.package.outputs.deb_name }}
            build/${{ steps.package.outputs.tar_name }}
          if-no-files-found: error

  build-windows:
    needs: [verify-version-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore pinned LLVM toolchain
        uses: actions/cache@v4
        with:
          path: .cache/llvm-toolchain
          key: llvm-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('metadata/LLVM_TOOLCHAIN', 'scripts/llvm_toolchain.sh') }}

      - name: Install dependencies
        shell: pwsh
        run: ./scripts/install.ps1

      - name: Build and test (Release)
        shell: bash
        run: ./scripts/test.sh --release

      - name: Verify Windows executable architecture
        run: python ./scripts/verify-executable-architecture.py build/dynlex.exe ${{ matrix.architecture }}

      - name: Stage Windows installation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/windows-stage
          cmake --install build --prefix build/windows-stage
          test -f build/windows-stage/bin/dynlex.exe
          python ./scripts/verify-executable-architecture.py \
            build/windows-stage/bin/dynlex.exe "${{ matrix.architecture }}"

      - name: Upload unsigned Windows installation
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.architecture }}
          path: |
            build/windows-stage
            build/CPackConfig.cmake
          if-no-files-found: error

  package-windows:
    needs: [build-windows]
    runs-on: windows-2025
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            wix_architecture: x64
            asset_id: windows-x64-msi
          - architecture: arm64
            wix_architecture: arm64
            asset_id: windows-arm64-msi
    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned Windows installation
        uses: actions/download-artifact@v4
        with:
          name: windows-build-${{ matrix.architecture }}
          path: windows-build

      - name: Install WiX toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $wix) {
            $wixBin = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.11\bin"
            if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
              throw "WiX was installed but candle.exe could not be located."
            }
            Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          }
          Get-Command cpack -ErrorAction Stop

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\windows-build\windows-stage\bin\dynlex.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: DynLex compiler
          description-url: https://dynlex.com
          correlation-id: ${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}-executable

      - name: Verify Windows executable signature
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1 -Path "windows-build/windows-stage/bin/dynlex.exe"

      - name: Package MSI
        id: package
        shell: bash
        run: |
          set -euo pipefail
          MSI_NAME="$(./scripts/release-asset.sh name '${{ matrix.asset_id }}')"
          PACKAGE_BASENAME="${MSI_NAME%.msi}"
          mkdir -p build
          cpack --config windows-build/CPackConfig.cmake \
            -G WIX \
            -B build \
            -D "CPACK_INSTALLED_DIRECTORIES=$PWD/windows-build/windows-stage;/" \
            -D 'CPACK_INSTALL_CMAKE_PROJECTS=' \
            -D CPACK_PACKAGE_FILE_NAME="$PACKAGE_BASENAME" \
            -D CPACK_WIX_ARCHITECTURE="${{ matrix.wix_architecture }}"
          test -f "build/$MSI_NAME"
          echo "name=$MSI_NAME" >> "$GITHUB_OUTPUT"

      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\${{ steps.package.outputs.name }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: DynLex installer
          description-url: https://dynlex.com
          correlation-id: ${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}-installer

      - name: Verify Windows installer signature
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1 -Path "build/${{ steps.package.outputs.name }}"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.architecture }}
          path: build/${{ steps.package.outputs.name }}
          if-no-files-found: error

  build-macos:
    needs: [verify-version-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
            machine_architecture: arm64
          - runner: macos-15-intel
            architecture: x64
            machine_architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore pinned LLVM toolchain
        uses: actions/cache@v4
        with:
          path: .cache/llvm-toolchain
          key: llvm-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('metadata/LLVM_TOOLCHAIN', 'scripts/llvm_toolchain.sh') }}

      - name: Install dependencies
        run: ./scripts/install.sh

      - name: Build and test (Release)
        run: ./scripts/test.sh --release

      - name: Stage architecture payload
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "${{ matrix.machine_architecture }}" ]]; then
            echo "Expected ${{ matrix.machine_architecture }} runner, found $(uname -m)." >&2
            exit 1
          fi
          rm -rf build/macos-stage
          cmake --install build --prefix "$PWD/build/macos-stage/usr/local"
          test -x build/macos-stage/usr/local/bin/dynlex
          test -f build/macos-stage/usr/local/lib/dynlex/libdynlex_runtime.a
          tar -czf "build/dynlex-macos-${{ matrix.architecture }}-payload.tar.gz" \
            -C build/macos-stage .

      - name: Upload architecture payload
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.architecture }}
          path: build/dynlex-macos-${{ matrix.architecture }}-payload.tar.gz
          if-no-files-found: error

  package-macos:
    runs-on: macos-14
    needs: [build-macos]
    environment: release-signing
    steps:
      - uses: actions/checkout@v4

      - name: Download ARM64 payload
        uses: actions/download-artifact@v4
        with:
          name: macos-build-arm64
          path: macos-payloads/arm64

      - name: Download x64 payload
        uses: actions/download-artifact@v4
        with:
          name: macos-build-x64
          path: macos-payloads/x64

      - name: Import Apple signing identities
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_APPLICATION_CERTIFICATE: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          APPLE_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ vars.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ vars.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/dynlex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          APPLICATION_CERTIFICATE_PATH="$RUNNER_TEMP/dynlex-application.p12"
          INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/dynlex-installer.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ vars.APPLE_API_KEY_ID }}.p8"

          printf '%s' "$APPLE_APPLICATION_CERTIFICATE" | base64 --decode > "$APPLICATION_CERTIFICATE_PATH"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$INSTALLER_CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$API_KEY_PATH"
          chmod 600 "$APPLICATION_CERTIFICATE_PATH" "$INSTALLER_CERTIFICATE_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APPLICATION_CERTIFICATE_PATH" \
            -P "$APPLE_APPLICATION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERTIFICATE_PATH" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S "apple-tool:,apple:,codesign:" \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v "$KEYCHAIN_PATH"
          security find-certificate -c "$APPLE_APPLICATION_SIGNING_IDENTITY" "$KEYCHAIN_PATH" > /dev/null
          security find-certificate -c "$APPLE_INSTALLER_SIGNING_IDENTITY" "$KEYCHAIN_PATH" > /dev/null

          echo "DYNLEX_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "DYNLEX_NOTARY_API_KEY=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Assemble, sign, and package universal PKG
        id: package
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ vars.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ vars.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < metadata/VERSION)"
          ARM64_ROOT="$RUNNER_TEMP/dynlex-macos-arm64"
          X64_ROOT="$RUNNER_TEMP/dynlex-macos-x64"
          UNIVERSAL_ROOT="$RUNNER_TEMP/dynlex-macos-universal"
          ARM64_PAYLOAD="$PWD/macos-payloads/arm64/dynlex-macos-arm64-payload.tar.gz"
          X64_PAYLOAD="$PWD/macos-payloads/x64/dynlex-macos-x64-payload.tar.gz"
          PACKAGE_NAME="$(./scripts/release-asset.sh name macos-universal-pkg)"
          PACKAGE_PATH="$PWD/build/$PACKAGE_NAME"

          mkdir -p "$ARM64_ROOT" "$X64_ROOT" "$UNIVERSAL_ROOT" build
          tar -xzf "$ARM64_PAYLOAD" -C "$ARM64_ROOT"
          tar -xzf "$X64_PAYLOAD" -C "$X64_ROOT"

          find "$ARM64_ROOT" -type f -print \
            | sed "s#^$ARM64_ROOT/##" \
            | LC_ALL=C sort > "$RUNNER_TEMP/dynlex-arm64-files.txt"
          find "$X64_ROOT" -type f -print \
            | sed "s#^$X64_ROOT/##" \
            | LC_ALL=C sort > "$RUNNER_TEMP/dynlex-x64-files.txt"
          diff -u \
            "$RUNNER_TEMP/dynlex-arm64-files.txt" \
            "$RUNNER_TEMP/dynlex-x64-files.txt"

          while IFS= read -r relative_path; do
            case "$relative_path" in
              usr/local/bin/dynlex|usr/local/lib/dynlex/libdynlex_runtime.a)
                continue
                ;;
            esac
            cmp "$ARM64_ROOT/$relative_path" "$X64_ROOT/$relative_path"
          done < "$RUNNER_TEMP/dynlex-arm64-files.txt"

          cp -R "$ARM64_ROOT"/. "$UNIVERSAL_ROOT/"
          lipo -create \
            "$ARM64_ROOT/usr/local/bin/dynlex" \
            "$X64_ROOT/usr/local/bin/dynlex" \
            -output "$UNIVERSAL_ROOT/usr/local/bin/dynlex"
          lipo -create \
            "$ARM64_ROOT/usr/local/lib/dynlex/libdynlex_runtime.a" \
            "$X64_ROOT/usr/local/lib/dynlex/libdynlex_runtime.a" \
            -output "$UNIVERSAL_ROOT/usr/local/lib/dynlex/libdynlex_runtime.a"
          lipo -verify_arch arm64 x86_64 "$UNIVERSAL_ROOT/usr/local/bin/dynlex"
          lipo -verify_arch arm64 x86_64 \
            "$UNIVERSAL_ROOT/usr/local/lib/dynlex/libdynlex_runtime.a"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_APPLICATION_SIGNING_IDENTITY" \
            "$UNIVERSAL_ROOT/usr/local/bin/dynlex"
          codesign --verify --strict --verbose=2 "$UNIVERSAL_ROOT/usr/local/bin/dynlex"
          pkgbuild \
            --root "$UNIVERSAL_ROOT" \
            --identifier "org.dynlex.dynlex" \
            --version "$VERSION" \
            --install-location "/" \
            "$RUNNER_TEMP/dynlex-component.pkg"
          productbuild \
            --package "$RUNNER_TEMP/dynlex-component.pkg" \
            "$RUNNER_TEMP/dynlex-unsigned.pkg"
          productsign \
            --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" \
            --timestamp \
            "$RUNNER_TEMP/dynlex-unsigned.pkg" \
            "$PACKAGE_PATH"
          pkgutil --check-signature "$PACKAGE_PATH"
          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple PKG
        env:
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          SUBMISSION_PLIST="$RUNNER_TEMP/dynlex-notary-submission.plist"
          NOTARY_LOG="$RUNNER_TEMP/dynlex-notary-log.json"

          set +e
          xcrun notarytool submit "${{ steps.package.outputs.package_path }}" \
            --key "$DYNLEX_NOTARY_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format plist > "$SUBMISSION_PLIST"
          NOTARYTOOL_EXIT_CODE=$?
          set -e

          if [[ ! -s "$SUBMISSION_PLIST" ]]; then
            echo "Apple notarytool did not return a submission result." >&2
            exit 1
          fi

          SUBMISSION_ID="$(/usr/libexec/PlistBuddy -c 'Print :id' "$SUBMISSION_PLIST")"
          SUBMISSION_STATUS="$(/usr/libexec/PlistBuddy -c 'Print :status' "$SUBMISSION_PLIST")"
          printf 'Apple notarization submission %s finished with status %s.\n' \
            "$SUBMISSION_ID" "$SUBMISSION_STATUS"

          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$DYNLEX_NOTARY_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            "$NOTARY_LOG"
          cat "$NOTARY_LOG"

          if [[ "$NOTARYTOOL_EXIT_CODE" -ne 0 || "$SUBMISSION_STATUS" != "Accepted" ]]; then
            echo "Apple rejected the DynLex installer notarization submission." >&2
            exit 1
          fi

          xcrun stapler staple "${{ steps.package.outputs.package_path }}"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error

      - name: Remove Apple signing credentials
        if: ${{ always() }}
        run: |
          if [[ -n "${DYNLEX_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DYNLEX_SIGNING_KEYCHAIN"
          fi
          rm -f \
            "$RUNNER_TEMP/dynlex-application.p12" \
            "$RUNNER_TEMP/dynlex-installer.p12" \
            "$RUNNER_TEMP/AuthKey_${{ vars.APPLE_API_KEY_ID }}.p8"

  smoke-linux:
    needs: [build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
            machine_architecture: x86_64
            format: deb
            asset_id: linux-x64-deb
          - runner: ubuntu-24.04
            architecture: x64
            machine_architecture: x86_64
            format: tar
            asset_id: linux-x64-tar
          - runner: ubuntu-24.04-arm
            architecture: arm64
            machine_architecture: aarch64
            format: deb
            asset_id: linux-arm64-deb
          - runner: ubuntu-24.04-arm
            architecture: arm64
            machine_architecture: aarch64
            format: tar
            asset_id: linux-arm64-tar
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.architecture }}
          path: release-artifacts/linux

      - name: Install package and validate
        run: |
          set -euo pipefail
          ls -lah release-artifacts/linux
          if [[ "$(uname -m)" != "${{ matrix.machine_architecture }}" ]]; then
            echo "Expected ${{ matrix.machine_architecture }} runner, found $(uname -m)." >&2
            exit 1
          fi
          PACKAGE_NAME="$(./scripts/release-asset.sh name '${{ matrix.asset_id }}')"
          if [[ "${{ matrix.format }}" == "deb" ]]; then
            sudo ./web/install.sh "release-artifacts/linux/$PACKAGE_NAME"
            DYNLEX_BIN="$(command -v dynlex)"
          else
            INSTALL_PREFIX="$RUNNER_TEMP/dynlex-tar-install"
            ./web/install.sh \
              --prefix "$INSTALL_PREFIX" \
              "release-artifacts/linux/$PACKAGE_NAME"
            DYNLEX_BIN="$INSTALL_PREFIX/bin/dynlex"
          fi
          python3 ./scripts/verify-executable-architecture.py \
            "$DYNLEX_BIN" "${{ matrix.architecture }}"
          "$DYNLEX_BIN" tests/required/simple/main.dl -o /tmp/dynlex-smoke-linux
          /tmp/dynlex-smoke-linux > /tmp/dynlex-smoke-linux.out
          diff -u tests/required/simple/expected.txt /tmp/dynlex-smoke-linux.out

  smoke-windows:
    needs: [package-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
            asset_id: windows-x64-msi
          - runner: windows-11-arm
            architecture: arm64
            asset_id: windows-arm64-msi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-${{ matrix.architecture }}
          path: release-artifacts/windows

      - name: Install MSI and validate
        shell: pwsh
        run: |
          Get-ChildItem -Path "release-artifacts/windows" -Recurse | Select-Object FullName
          $msiName = (bash ./scripts/release-asset.sh name '${{ matrix.asset_id }}').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve the Windows package name from the release manifest."
          }
          $msi = Get-Item "release-artifacts/windows/$msiName" -ErrorAction SilentlyContinue
          if (-not $msi) {
            throw "Expected MSI artifact was not downloaded."
          }
          ./scripts/verify-windows-signature.ps1 -Path $msi.FullName
          Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait -NoNewWindow
          $dynlex = Get-Item "C:\Program Files\dynlex\bin\dynlex.exe" -ErrorAction SilentlyContinue
          if (-not $dynlex) {
            $dynlex = Get-ChildItem "C:\Program Files" -Filter dynlex.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $dynlex) {
            throw "dynlex.exe not found after MSI install."
          }
          python ./scripts/verify-executable-architecture.py $dynlex.FullName ${{ matrix.architecture }}
          if ($LASTEXITCODE -ne 0) {
            throw "Installed DynLex executable has the wrong architecture."
          }
          ./scripts/verify-windows-signature.ps1 -Path $dynlex.FullName
          $helpStdout = "$env:TEMP\\dynlex-smoke-windows-help.stdout.log"
          $helpStderr = "$env:TEMP\\dynlex-smoke-windows-help.stderr.log"
          $helpExit = -1
          try {
            $helpProc = Start-Process -FilePath $dynlex.FullName -ArgumentList "--help" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $helpStdout -RedirectStandardError $helpStderr
            $helpExit = $helpProc.ExitCode
          } catch {
            Write-Host $_
            throw "dynlex --help launch failed"
          }
          if (Test-Path $helpStdout) { Get-Content $helpStdout | Write-Host }
          if (Test-Path $helpStderr) { Get-Content $helpStderr | Write-Host }
          if ($helpExit -ne 0) {
            throw "dynlex --help failed with exit code $helpExit"
          }
          & $dynlex.FullName "tests/required/simple/main.dl" --emit-llvm -o "$env:TEMP\\dynlex-smoke-windows.ll" 2>&1 | Tee-Object -FilePath "$env:TEMP\\dynlex-smoke-windows-compile.log"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:TEMP\\dynlex-smoke-windows.ll")) {
            Get-Content "$env:TEMP\\dynlex-smoke-windows-compile.log" | Write-Host
            throw "dynlex emit-llvm step failed. See dynlex-smoke-windows-compile.log"
          }
          $llvmIr = Get-Content "$env:TEMP\\dynlex-smoke-windows.ll" -Raw
          if ($llvmIr -notmatch "define .*@main\(") {
            throw "LLVM IR output does not contain a main definition."
          }

  smoke-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            machine_architecture: arm64
          - runner: macos-15-intel
            machine_architecture: x86_64
    runs-on: ${{ matrix.runner }}
    needs: [package-macos]
    env:
      APPLE_APPLICATION_SIGNING_IDENTITY: ${{ vars.APPLE_APPLICATION_SIGNING_IDENTITY }}
      APPLE_INSTALLER_SIGNING_IDENTITY: ${{ vars.APPLE_INSTALLER_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/macos

      - name: Install PKG and validate
        run: |
          set -euo pipefail
          ls -lah release-artifacts/macos
          if [[ "$(uname -m)" != "${{ matrix.machine_architecture }}" ]]; then
            echo "Expected ${{ matrix.machine_architecture }} runner, found $(uname -m)." >&2
            exit 1
          fi
          PACKAGE_NAME="$(./scripts/release-asset.sh name macos-universal-pkg)"
          PKG="release-artifacts/macos/$PACKAGE_NAME"
          test -f "$PKG"
          sudo installer -pkg "$PKG" -target /
          if command -v dynlex >/dev/null 2>&1; then
            DYNLEX_BIN="$(command -v dynlex)"
          elif [ -x /usr/local/bin/dynlex ]; then
            DYNLEX_BIN="/usr/local/bin/dynlex"
          else
            DYNLEX_BIN="$(find /usr/local -name dynlex -type f | head -n 1)"
          fi
          [ -n "${DYNLEX_BIN:-}" ] && [ -x "$DYNLEX_BIN" ]
          lipo -verify_arch arm64 x86_64 "$DYNLEX_BIN"
          ./scripts/verify-macos-signature.sh "$PKG" "$DYNLEX_BIN"
          "$DYNLEX_BIN" tests/required/simple/main.dl -o /tmp/dynlex-smoke-macos
          /tmp/dynlex-smoke-macos > /tmp/dynlex-smoke-macos.out
          diff -u tests/required/simple/expected.txt /tmp/dynlex-smoke-macos.out

  publish-release:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    needs: [build-linux, package-windows, package-macos, smoke-linux, smoke-windows, smoke-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: release-artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-windows-*
          merge-multiple: true
          path: release-artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/macos

      - name: Prepare checksummed release assets
        run: ./scripts/prepare-release-assets.sh release-artifacts release-upload

      - name: Create and verify clean GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" 2>/dev/null)"; then
            if [[ "$(jq -r .draft <<<"$RELEASE_JSON")" != "true" ]]; then
              echo "A published release already exists for $TAG; published releases are immutable." >&2
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi

          release_arguments=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            release_arguments+=(--prerelease)
          fi
          gh release create "$TAG" release-upload/* "${release_arguments[@]}"

          find release-upload -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets.txt"
          gh release view "$TAG" --json assets \
            --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-release-assets.txt"
          diff -u \
            "$RUNNER_TEMP/expected-release-assets.txt" \
            "$RUNNER_TEMP/actual-release-assets.txt"
          gh release edit "$TAG" --draft=false
