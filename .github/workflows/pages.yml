name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ./scripts/install.sh
      - name: Configure LLVM for web build
        run: |
          . ./scripts/llvm_version.sh
          LLVM_VERSION="$(dynlex_install_llvm_version)"
          LLVM_CONFIG="llvm-config-$LLVM_VERSION"
          if ! command -v "$LLVM_CONFIG" >/dev/null 2>&1; then
            LLVM_CONFIG="llvm-config"
          fi
          LLVM_CMAKE_DIR="$($LLVM_CONFIG --cmakedir)"
          test -f "$LLVM_CMAKE_DIR/LLVMConfig.cmake"
          echo "LLVM_DIR=$LLVM_CMAKE_DIR" >> "$GITHUB_ENV"
          echo "DYNLEX_LLVM_VERSION=$LLVM_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build web compiler artifacts
        run: ./scripts/build_web.sh
      - name: Install IDE dependencies
        run: cd src/web/ide && npm ci
      - name: Build IDE and refresh web root
        run: ./scripts/build_web_root.sh
      - name: Verify web compiler artifacts are in deploy root
        run: |
          test -f web/compiler/dynlex_web.js
          test -f web/compiler/dynlex_web.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
