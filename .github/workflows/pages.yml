name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ./scripts/install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure LLVM for web build
        run: |
          if [ -z "${EMSDK:-}" ]; then
            echo "EMSDK is not set after setup-emsdk."
            exit 1
          fi
          LLVM_CMAKE_DIR="$EMSDK/upstream/lib/cmake/llvm"
          LLVM_CONFIG="$EMSDK/upstream/bin/llvm-config"
          test -f "$LLVM_CMAKE_DIR/LLVMConfig.cmake"
          test -x "$LLVM_CONFIG"
          LLVM_VERSION="$("$LLVM_CONFIG" --version | cut -d. -f1)"
          echo "LLVM_DIR=$LLVM_CMAKE_DIR" >> "$GITHUB_ENV"
          echo "DYNLEX_LLVM_VERSION=$LLVM_VERSION" >> "$GITHUB_ENV"
      - name: Build web compiler artifacts
        run: ./scripts/build_web.sh
      - name: Install IDE dependencies
        run: cd src/web/ide && npm ci
      - name: Build IDE and refresh web root
        run: ./scripts/build_web_root.sh
      - name: Verify web compiler artifacts are in deploy root
        run: |
          test -f web/compiler/dynlex_web.js
          test -f web/compiler/dynlex_web.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
