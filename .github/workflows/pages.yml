name: Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify committed web compiler artifacts
        run: |
          test -f src/web/ide/public/compiler/dynlex_web.js
          test -f src/web/ide/public/compiler/dynlex_web.wasm
      - name: Install IDE dependencies
        run: cd src/web/ide && npm ci
      - name: Build IDE and refresh web root
        run: ./scripts/build_web_root.sh
      - name: Verify web compiler artifacts are in deploy root
        run: |
          test -f web/compiler/dynlex_web.js
          test -f web/compiler/dynlex_web.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
