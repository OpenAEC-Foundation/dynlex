name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: ./scripts/install.sh

      - name: Build and test
        run: |
          ./scripts/build.sh --lint=false
          chmod +x ./build/dynlex
          ./scripts/run_tests.sh

  build-and-test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: ./scripts/install.sh

      - name: Configure LLVM in PATH
        run: |
          if brew info llvm@20 >/dev/null 2>&1; then
            echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          else
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          fi

      - name: Build and test
        run: |
          ./scripts/build.sh --lint=false
          chmod +x ./build/dynlex
          ./scripts/run_tests.sh

  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: ./scripts/install.ps1 -Minimal
        shell: pwsh

      - name: Build and smoke test
        run: |
          $clangPath = (Get-Command clang).Source
          $llvmBin = Split-Path -Parent $clangPath
          $llvmRoot = Split-Path -Parent $llvmBin
          $env:PATH = "$llvmBin;$env:PATH"
          $env:LLVM_DIR = "$llvmRoot\lib\cmake\llvm"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLLVM_DIR="$env:LLVM_DIR"
          cmake --build build --parallel
          & .\build\dynlex.exe tests\required\simple\main.dl -o tests\required\simple\main_test.exe
          $actual = (& .\tests\required\simple\main_test.exe) -join "`n"
          $expected = (Get-Content tests\required\simple\expected.txt -Raw).TrimEnd("`r", "`n")
          if ($actual.TrimEnd("`r", "`n") -ne $expected) {
            throw "Windows smoke test output mismatch."
          }
        shell: pwsh

  launchpad-source-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Launchpad packaging dependencies
        run: ./packaging/launchpad/scripts/install-build-deps.sh

      - name: Build unsigned Launchpad source package
        run: ./packaging/launchpad/scripts/build-source-package.sh --series noble --version 0.1.0+ci${{ github.run_number }}.g${GITHUB_SHA::7}
