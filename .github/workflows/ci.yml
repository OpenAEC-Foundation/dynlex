name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: ./scripts/install.sh

      - name: Build
        run: ./scripts/build.sh --lint=false

      - name: Run tests
        run: ./scripts/run_tests.sh
