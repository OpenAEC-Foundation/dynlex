name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-20 clang-format-20 llvm-20 llvm-20-dev

      - name: Install build tools
        run: |
          sudo apt-get install -y cmake ninja-build
          pipx install conan
          conan profile detect --force

      - name: Build
        run: ./scripts/build.sh --lint=false

      - name: Run tests
        run: ./scripts/run_tests.sh
