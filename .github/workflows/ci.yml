name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            install_cmd: ./scripts/install.sh
            build_cmd: ./scripts/build.sh --lint=false
            test_cmd: ./scripts/run_tests.sh
            shell: bash
          - os: macos-14
            install_cmd: ./scripts/install.sh
            build_cmd: ./scripts/build.sh --lint=false
            test_cmd: ./scripts/run_tests.sh
            shell: bash
          - os: windows-2022
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: ${{ matrix.install_cmd }}
        shell: ${{ matrix.shell }}

      - name: Configure LLVM in PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Build and test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.build_cmd }}
          chmod +x ./build/dynlex
          ${{ matrix.test_cmd }}
        shell: ${{ matrix.shell }}

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/install.ps1
        shell: pwsh

      - name: Build and smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $env:LLVM_DIR = "$env:ProgramFiles\LLVM\lib\cmake\llvm"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLLVM_DIR="$env:LLVM_DIR"
          cmake --build build --parallel
          & .\build\dynlex.exe tests\required\simple\main.dl -o tests\required\simple\main_test.exe
          $actual = (& .\tests\required\simple\main_test.exe) -join "`n"
          $expected = (Get-Content tests\required\simple\expected.txt -Raw).TrimEnd("`r", "`n")
          if ($actual.TrimEnd("`r", "`n") -ne $expected) {
            throw "Windows smoke test output mismatch."
          }
        shell: pwsh

  launchpad-source-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Launchpad packaging dependencies
        run: ./packaging/launchpad/scripts/install-build-deps.sh

      - name: Build unsigned Launchpad source package
        run: ./packaging/launchpad/scripts/build-source-package.sh --series noble --version 0.1.0+ci${{ github.run_number }}.g${GITHUB_SHA::7}
