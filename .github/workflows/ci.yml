name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: ./scripts/install.sh

      - name: Build and test
        run: |
          ./scripts/build.sh --lint=false
          chmod +x ./build/dynlex
          ./scripts/run_tests.sh

  build-and-test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: ./scripts/install.sh

      - name: Configure LLVM in PATH
        id: macos_llvm
        run: |
          if brew info llvm@20 >/dev/null 2>&1; then
            echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          else
            echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        run: |
          LLVM_DIR="$LLVM_DIR" DYNLEX_LLVM_VERSION=20 ./scripts/build.sh --lint=false
          chmod +x ./build/dynlex
          ./scripts/run_tests.sh

  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: ./scripts/install.ps1 -Minimal
        shell: pwsh

      - name: Build and smoke test
        run: |
          $roots = @("C:\Program Files\LLVM", "C:\ProgramData\chocolatey\lib")
          $llvmConfig = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $llvmConfig = Get-ChildItem -Path $root -Recurse -Filter LLVMConfig.cmake -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($llvmConfig) { break }
            }
          }
          if (-not $llvmConfig) {
            Write-Warning "Could not locate LLVMConfig.cmake; skipping Windows compile smoke test on this runner image."
            clang --version
            cmake --version
            ninja --version
            exit 0
          }

          $env:LLVM_DIR = Split-Path -Parent $llvmConfig.FullName
          $llvmRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $llvmConfig.FullName))
          $env:PATH = "$llvmRoot\bin;$env:PATH"

          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLLVM_DIR="$env:LLVM_DIR"
          cmake --build build --parallel
          & .\build\dynlex.exe tests\required\simple\main.dl -o tests\required\simple\main_test.exe
          $actual = (& .\tests\required\simple\main_test.exe) -join "`n"
          $expected = (Get-Content tests\required\simple\expected.txt -Raw).TrimEnd("`r", "`n")
          if ($actual.TrimEnd("`r", "`n") -ne $expected) {
            throw "Windows smoke test output mismatch."
          }
        shell: pwsh

  launchpad-source-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Launchpad packaging dependencies
        run: ./packaging/launchpad/scripts/install-build-deps.sh

      - name: Build unsigned Launchpad source package
        run: ./packaging/launchpad/scripts/build-source-package.sh --series noble --version 0.1.0+ci${{ github.run_number }}.g${GITHUB_SHA::7}
