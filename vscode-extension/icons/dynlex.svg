<title id="title">DynLex — original logo in cast gold</title>
<desc id="desc">The original DynLex outline in cast gold. The lightning bevel and its visible walls use one opaque, unlit emissive material with warm bloom. Only the surrounding metal body retains reflective shading.</desc>
